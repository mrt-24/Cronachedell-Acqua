<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronache dell'acqua</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .popup-titolo {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .popup-regione {
            font-size: 14px;
            margin-bottom: 10px;
        }

        .pdf-link {
            display: inline-block;
            padding: 7px 10px;
            background: #c62828;
            color: white !important;
            text-decoration: none;
            border-radius: 4px;
            margin: 3px 0;
        }

        .pdf-link:hover {
            background: #8e0000;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
